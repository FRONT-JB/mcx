[project]
name = "mission-control"
dynamic = ["version"]
description = "Mission Control — specification-first mission coordinator for AI coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
# MCP 표면만 SDK를 쓴다 — core는 pydantic 하나다 (ADR-0012, ADR-0041 §1).
mcp = ["mcp>=1.2.0"]

[project.scripts]
mcx = "mission_control.cli.main:run"
mcx-mcp = "mission_control.mcp.server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
# .git 없는 소스 복사본(플러그인 설치 캐시)의 빌드 버전 — plugin manifest와
# 항상 같아야 하며 tests/unit/skills/test_skill_artifacts.py가 강제한다 (ADR-0054).
fallback_version = "0.1.2"

[tool.hatch.build.hooks.vcs]
version-file = "src/mission_control/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mission_control"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# brief/와 blueprint/가 같은 이름의 테스트 모듈(test_state.py 등)을 가지므로
# 경로 기반 import가 필요하다. __init__.py 없는 flat 레이아웃을 유지한다.
addopts = ["--import-mode=importlib"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["src/mission_control/_version.py"]

# MCP SDK는 optional extra다 — 설치되지 않은 환경에서도 검사가 서야 한다
# (ADR-0041 §1: SDK 의존은 server.py 하나).
[[tool.mypy.overrides]]
module = ["mcp.*", "anyio"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/mission_control/_version.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
