name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    # Persistence uses POSIX-only fcntl. Windows runners remain out of scope
    # until the platform/locking contract is resolved in a separate issue.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests and coverage
        run: uv run pytest

      - name: Type check
        run: uv run mypy src

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check src tests
